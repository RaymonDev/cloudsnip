name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Start the app and load the UI
        shell: bash
        run: |
          python -m cloudsnip --no-browser --port 8765 > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8765/ > index.html && break; sleep 1; done
          grep -q 'cs-token' index.html
          curl -sf http://127.0.0.1:8765/static/app.js > /dev/null
          cat server.log
